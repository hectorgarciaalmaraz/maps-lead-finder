[tool.black]
line-length = 100
target-version = ["py310"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
# E501: long Spanish prompt/template strings are kept verbatim; black formats the code.
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["config", "skills", "tools", "main", "dashboard"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint.per-file-ignores]
# _search_all_pages() closes over the loop's `prospect` but is awaited within the same iteration.
"tools/contact_finder.py" = ["B023"]
